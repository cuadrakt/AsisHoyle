<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AsisHoyle | Control de Asistencia</title>

    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="login-logo">
                <img src="img/logo.jpg" alt="Logo del Colegio Daniel Hoyle">
            </div>

            <h1>AsisHoyle</h1>

            <h2>Sistema de Control de Asistencia</h2>

            <p class="institucion">
                Institución Educativa N.º 80865
                <strong>Daniel Hoyle</strong>
            </p>

            <div class="login-divider"></div>

            <h3>Iniciar sesión</h3>

            <p class="login-description">
                Ingresa tus datos para acceder al sistema.
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Ingresa tu usuario"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresa tu contraseña"
                        required
                    >
                </div>

                <button type="submit" class="btn-login">
                    Ingresar al sistema
                </button>

            </form>

            <p id="mensaje" class="mensaje"></p>

            <div class="login-footer">
                <p>© 2026 AsisHoyle</p>
                <p>Colegio Daniel Hoyle - Trujillo. Todos los Derechos Reservados.</p>
            </div>

        </section>

    </main>

    <script src="js/login.js"></script>

</body>
</html>
